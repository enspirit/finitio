# Serves the prerendered site. Everything under .output/public is a plain
# file, so there is no application server and no runtime dependency on Node.

server {
  listen 4000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Nuxt writes each route as <route>/index.html, and emits small HTML files
  # for the /reference redirects. Serve the file, then the directory index,
  # then fall through to the 404 page.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Build assets carry a content hash in their name.
  location /_nuxt/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # The playground runs entirely in the browser and the site makes no
  # cross-origin requests, so it can be locked down tightly.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
